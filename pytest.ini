[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
asyncio_mode = auto

# The suite must run with no microphone, no display, no API key and no network.
# Anything that needs one of those belongs behind a marker, not in the default run.
markers =
    hardware: needs a real audio device, display or camera
    network: reaches an external service
